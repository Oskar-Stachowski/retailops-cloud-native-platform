# RetailOps local development runtime.
#
# This Docker Compose file is intended for local development, portfolio demos,
# and CI smoke validation only. It intentionally exposes service ports on the
# host loopback and uses simple default credentials to keep the local setup reproducible.
#
# Image tags in this local stack are intentionally pinned to explicit versions,
# not digests. For production-style delivery, prefer digest-pinned images in
# deployment manifests and CI promotion steps.
#
# Do not use this file as a production deployment template.
# Non-local environments require a separate deployment configuration with real
# authentication and secrets from a secret manager.

# Local-only host port exposure
# -----------------------------
# The services below publish ports only on 127.0.0.1 so a reviewer can run and
# inspect the full platform locally: frontend, API, PostgreSQL, Redpanda,
# Prometheus, and Grafana. This address is intentionally not configurable here:
# demo user selection is not authentication.
#
# This is not a production networking model.
#
# In a production-style deployment:
# - only the public frontend/API entry point should be reachable from the internet,
# - PostgreSQL must stay in private subnets with no public host port,
# - Redpanda/Kafka must stay private to application services,
# - Prometheus and Grafana must be private, VPN-protected, or identity-protected,
# - credentials and admin passwords must come from a secret manager.

services:
  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-retailops-frontend:0.1.0}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    profiles: ["dev", "observability", "test"]
    build:
      context: ./services/api
    image: ${API_IMAGE:-retailops-api:0.1.0}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-retailops}:${POSTGRES_PASSWORD:-retailops}@db:5432/${POSTGRES_DB:-retailops}
      RETAILOPS_BROKER_BOOTSTRAP_SERVERS: ${RETAILOPS_BROKER_BOOTSTRAP_SERVERS:-redpanda:9092}
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.11@sha256:3ea272e5cab64a4a62240c682e2c62433b25614d956d44c299a10cb6994f6f2e
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-retailops}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  redpanda:
    profiles: ["dev", "observability", "test"]
    image: redpandadata/redpanda:v25.3.17@sha256:c96a71811ec85eee436b7471e4d2777b70ceb4d6a0bc5447094854b3150511c1
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "127.0.0.1:${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  redpanda-init:
    profiles: ["dev", "observability", "test"]
    image: redpandadata/redpanda:v25.3.17@sha256:c96a71811ec85eee436b7471e4d2777b70ceb4d6a0bc5447094854b3150511c1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in \
          retailops.sales.v1 \
          retailops.inventory.v1 \
          retailops.pricing.v1 \
          retailops.intelligence.v1 \
          retailops.operations.v1 \
          retailops.dlq.v1
        do
          rpk -X brokers=redpanda:9092 topic create "$$topic" \
            --partitions 3 \
            --replicas 1 \
            --if-not-exists
        done
        rpk -X brokers=redpanda:9092 topic create retailops.intelligence.v2 \
          --partitions 3 --replicas 1 --if-not-exists
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  # One-shot services intentionally reuse the API image.
  # Build it first when running migration/seed jobs directly:
  #   docker compose build api
  migrate:
    profiles: ["dev", "observability", "test"]
    image: ${API_IMAGE:-retailops-api:0.1.0}
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-retailops}:${POSTGRES_PASSWORD:-retailops}@db:5432/${POSTGRES_DB:-retailops}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    # Explicit operation: reimports demo tables and must never run during a normal up.
    profiles: ["seed"]
    image: ${API_IMAGE:-retailops-api:0.1.0}
    command: ["python", "scripts/seed_demo_data.py"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-retailops}:${POSTGRES_PASSWORD:-retailops}@db:5432/${POSTGRES_DB:-retailops}
      PYTHONPATH: /app
      RETAILOPS_SEED_DATA_PROFILE: ${RETAILOPS_SEED_DATA_PROFILE:-small}
      RETAILOPS_SEED_DATA_DIR: ${RETAILOPS_SEED_DATA_DIR:-}
    volumes:
      - ./data:/workspace/data:ro
    restart: "no"

  db:
    profiles: ["dev", "observability", "test"]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailops}
      POSTGRES_USER: ${POSTGRES_USER:-retailops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailops}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailops} -d ${POSTGRES_DB:-retailops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  security-tools:
    profiles: ["security"]
    image: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - trivy_cache:/root/.cache/trivy
    entrypoint: ["trivy"]
    command:
      - fs
      - --severity
      - CRITICAL,HIGH
      - --ignore-unfixed
      - --exit-code
      - "0"
      - /workspace
    restart: "no"

volumes:
  postgres_data:
  redpanda_data:
  prometheus_data:
  grafana_data:
  trivy_cache:
