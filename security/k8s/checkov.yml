# Blocking Kubernetes Checkov baseline for the local portfolio manifests.
# Every finding fails unless its check ID has a documented exception below.

framework:
  - kubernetes

directory:
  - k8s

soft-fail: false
quiet: false
compact: true
download-external-modules: false

# Accepted local-runtime exceptions are documented in security/README.md.
skip-check:
  - CKV_K8S_15
  - CKV_K8S_22
  - CKV_K8S_23
  - CKV_K8S_35
  - CKV_K8S_40
  - CKV_K8S_43
