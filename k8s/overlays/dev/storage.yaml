apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: retailops
  labels:
    app.kubernetes.io/part-of: retailops-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
