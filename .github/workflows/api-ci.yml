name: API CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://retailops:retailops@localhost:5432/retailops
  REQUIRE_DB_TESTS: "1"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/api
  API_REPORT_DIR: ci-cd/reports/api
  DATA_REPORT_DIR: ci-cd/reports/data
  SECURITY_REPORT_DIR: ci-cd/reports/security

jobs:
  api-integration-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: retailops
          POSTGRES_PASSWORD: retailops
          POSTGRES_DB: retailops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U retailops -d retailops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        shell: bash
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python CI toolchain
        uses: ./.github/actions/setup-python-ci

      - name: Prepare evidence directories
        working-directory: .
        run: mkdir -p "${API_REPORT_DIR}" "${DATA_REPORT_DIR}" "${SECURITY_REPORT_DIR}"

      - name: Prepare isolated facts worker
        working-directory: .
        run: docker pull python@sha256:90744cff8f32887f075c47d747a173ff333e9e98801667af93c357fa9f5e28ff

      - name: Prepare pinned images for broker durability tests
        working-directory: .
        run: |
          docker pull postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          docker pull redpandadata/redpanda:v25.3.6@sha256:ac152ec27adccf9482af2649d293f398eb03c860d7469fc49f86e30d870ea408

      - name: Run backend static quality gates
        working-directory: .
        run: |
          set -euo pipefail
          python -m ruff check services/api/app services/api/scripts services/api/tests data ml scripts/ci/ml_experiment_report.py --config pyproject.toml
          python -m ruff format --check services/api/app services/api/scripts services/api/tests data ml scripts/ci/ml_experiment_report.py --config pyproject.toml
          python -m mypy --config-file pyproject.toml
          python -m bandit \
            --severity-level high \
            --confidence-level high \
            -q \
            -r services/api/app services/api/scripts \
            -f txt \
            -o "${SECURITY_REPORT_DIR}/bandit-api.txt"

      - name: Verify fixed-origin ML assessment contract
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p ci-cd/reports/ml/ci
          python -m pytest -q \
            services/api/tests/test_assessed_rf_pipeline.py \
            services/api/tests/test_forecast_admission_policy.py \
            services/api/tests/test_fixed_origin_evaluation.py::test_future_holdout_outcomes_cannot_change_frozen_predictions \
            services/api/tests/test_model_metadata_registry.py::test_registry_refuses_direct_status_override \
            | tee ci-cd/reports/ml/ci/assessment-tests.txt

      - name: Generate demo CSV dataset
        working-directory: .
        run: python -m data.generator.main

      - name: Validate data contracts and scenario coverage
        working-directory: .
        run: make data-contracts data-scenario-report

      - name: Run database migrations
        env:
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Seed demo data
        env:
          PYTHONPATH: .
          RETAILOPS_SEED_DATA_PROFILE: demo
        run: python scripts/seed_demo_data.py

      - name: Run API tests with coverage
        env:
          REQUIRE_BROKER_TESTS: "1"
        run: |
          set -euo pipefail
          mkdir -p ../../ci-cd/reports/api
          rm -f .coverage .coverage.*
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=80 \
            --cov-report=xml:../../ci-cd/reports/api/coverage.xml

      - name: Write API CI summary
        if: always()
        working-directory: .
        run: |
          {
            echo "## API CI evidence"
            echo ""
            echo "| Evidence | Path |"
            echo "|---|---|"
            echo "| Coverage XML | \`ci-cd/reports/api/coverage.xml\` |"
            echo "| Bandit report | \`ci-cd/reports/security/bandit-api.txt\` |"
            echo "| Data contract report | \`ci-cd/reports/data/data-contract-report.json\` |"
            echo "| Scenario coverage report | \`ci-cd/reports/data/scenario-coverage-report.json\` |"
            echo "| ML assessment contract tests | \`ci-cd/reports/ml/ci/assessment-tests.txt\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload API coverage evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: api-coverage-evidence
          path: ci-cd/reports/api/coverage.xml
          if-no-files-found: warn

      - name: Upload API security evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: api-bandit-evidence
          path: ci-cd/reports/security/bandit-api.txt
          if-no-files-found: warn

      - name: Upload API data evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: api-data-contract-evidence
          path: |
            ci-cd/reports/data/data-contract-report.json
            ci-cd/reports/data/scenario-coverage-report.json
            docs/evidence/data/scenario-coverage-report.md
          if-no-files-found: warn

      - name: Upload ML assessment test evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: ml-assessment-contract-evidence
          path: ci-cd/reports/ml/ci/assessment-tests.txt
          if-no-files-found: warn

  api-image-build:
    name: API Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: api-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare API image evidence directory
        run: mkdir -p ci-cd/reports/docker

      - name: Build API Docker image
        run: docker build -t retailops-api:ci services/api

      - name: Capture API image metadata
        if: always()
        run: docker image inspect retailops-api:ci > ci-cd/reports/docker/api-image-inspect.json

      - name: Upload API image build evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: api-image-build-evidence
          path: ci-cd/reports/docker/api-image-inspect.json
          if-no-files-found: warn
