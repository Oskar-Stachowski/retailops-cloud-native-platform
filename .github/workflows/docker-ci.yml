name: Docker Compose CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-compose-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: Validate Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Docker Compose config
        run: make compose-config

      - name: Validate Compose profiles
        run: make compose-profile-config

      - name: Verify security scanner container
        run: |
          set -euo pipefail
          docker compose --profile security run --rm --no-deps security-tools --version \
            | tee ci-cd/reports/docker/trivy-version.txt

      - name: Upload Compose config evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: docker-compose-config-evidence
          path: ci-cd/reports/docker/
          if-no-files-found: warn

  compose-smoke:
    name: Build full stack and run smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: compose-config

    env:
      SMOKE_MAX_ATTEMPTS: "45"
      SMOKE_SLEEP_SECONDS: "2"
      COMPOSE_BROWSER_TESTS: "1"
      E2E_ALLOW_MUTATIONS: "1"
      PLAYWRIGHT_BROWSER_CHANNEL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Set up browser test dependencies
        uses: ./.github/actions/setup-node-ci

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Fresh-build, start and smoke-test full stack
        run: make compose-ci

      - name: Verify isolated database recovery
        run: make db-recovery-drill

      - name: Write Docker Compose CI summary
        if: always()
        run: |
          {
            echo "## Docker Compose CI evidence"
            echo ""
            echo "| Evidence | Path |"
            echo "|---|---|"
            echo "| Compose process snapshot | \`ci-cd/reports/docker-compose-ps.txt\` |"
            echo "| Compose failure logs | \`ci-cd/reports/docker-compose-logs.txt\` |"
            echo "| Docker profile configs | \`ci-cd/reports/docker/\` |"
            echo "| Observability smoke evidence | \`ci-cd/reports/observability/\` |"
            echo "| Browser journeys and failure traces | \`ci-cd/reports/e2e/\` |"
            echo "| Database recovery report | \`ci-cd/reports/db/recovery/*/report.json\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Compose smoke evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: docker-compose-ci-evidence
          path: |
            ci-cd/reports/docker-compose-ps.txt
            ci-cd/reports/docker-compose-logs.txt
            ci-cd/reports/docker/
            ci-cd/reports/observability/
            ci-cd/reports/e2e/
            ci-cd/reports/db/recovery/*/report.json
            ci-cd/reports/db/recovery/*/commands.log
          if-no-files-found: ignore

      - name: Final cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
