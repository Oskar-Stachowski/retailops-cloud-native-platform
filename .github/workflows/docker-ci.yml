name: Docker Compose CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-compose-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-bundles:
    name: Authenticated immutable native source bundle import
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Resolve immutable native producer and typed client
        id: bundle-owners
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path("scripts/source-bundles/owner.json").read_text())
          assert pin["producer_repository"] == "Oskar-Stachowski/retailops-cloud-native-platform"
          assert pin["client_repository"] == "Oskar-Stachowski/retailops-ai-intelligence"
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              for name in ("producer_commit", "client_commit"):
                  assert re.fullmatch(r"[0-9a-f]{40}", pin[name])
                  stream.write(name + "=" + pin[name] + "\n")
          PY
      - name: Checkout approved native source exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Oskar-Stachowski/retailops-cloud-native-platform
          ref: ${{ steps.bundle-owners.outputs.producer_commit }}
          path: .ci-source-bundle-producer
          persist-credentials: false
      - name: Checkout pinned typed AI receiver and isolated lock
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Oskar-Stachowski/retailops-ai-intelligence
          ref: ${{ steps.bundle-owners.outputs.client_commit }}
          path: .ci-source-bundle-client
          persist-credentials: false
      - name: Set up isolated CI source runtime
        uses: ./.github/actions/setup-python-ci
        with:
          python-version: "3.11.15"
          install-command: python -m pip install -r services/api/requirements.txt -r .ci-source-bundle-producer/data/requirements-parquet.txt
      - name: Install immutable transfer toolchain
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          enable-cache: false
      - name: Install separate minimal typed receiver
        run: uv sync --locked --project .ci-source-bundle-client/tools/source-bundle-verification --python 3.11.15
      - name: Require native export, HTTP authorization and actual typed import
        run: |
          python scripts/source-bundles/drill.py \
            --producer-root .ci-source-bundle-producer \
            --client-root .ci-source-bundle-client \
            --producer-python "$(command -v python)" \
            --api-python "$(command -v python)" \
            --client-python "$GITHUB_WORKSPACE/.ci-source-bundle-client/tools/source-bundle-verification/.venv/bin/python"
      - name: Upload immutable native transfer receipt
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: source-bundle-evidence
          path: ci-cd/reports/source-bundles/report.json
          if-no-files-found: error

  intelligence-runtime:
    name: Authenticated cross-repo intelligence runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Resolve immutable intelligence runtime owner
        id: runtime-owner
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path("scripts/intelligence-runtime/owner.json").read_text())
          assert pin["repository"] == "Oskar-Stachowski/retailops-ai-intelligence"
          assert re.fullmatch(r"[0-9a-f]{40}", pin["commit"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("commit=" + pin["commit"] + "\n")
          PY
      - name: Checkout pinned AI outbox and isolated delivery lock
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Oskar-Stachowski/retailops-ai-intelligence
          ref: ${{ steps.runtime-owner.outputs.commit }}
          path: .ci-intelligence-runtime-owner
          persist-credentials: false
      - name: Require actual authenticated transport and durable resume
        run: python scripts/intelligence-runtime/drill.py --owner-root .ci-intelligence-runtime-owner
      - name: Upload intelligence runtime acceptance receipt
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: intelligence-runtime-evidence
          path: ci-cd/reports/intelligence-runtime/report.json
          if-no-files-found: error

  compose-config:
    name: Validate Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate Docker Compose config
        run: make compose-config

      - name: Validate Compose profiles
        run: make compose-profile-config

      - name: Validate existing-service intelligence overlay without joining a runtime
        env:
          RETAILOPS_INTELLIGENCE_NETWORK: ai10-source-owned-config-validation
        run: docker compose -p ai10-source-overlay-config --profile dev -f docker-compose.yml -f docker-compose.intelligence.yml config --quiet

      - name: Verify security scanner container
        run: |
          set -euo pipefail
          docker compose --profile security run --rm --no-deps security-tools --version \
            | tee ci-cd/reports/docker/trivy-version.txt

      - name: Upload Compose config evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: docker-compose-config-evidence
          path: ci-cd/reports/docker/
          if-no-files-found: warn

  compose-smoke:
    name: Build full stack and run smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: compose-config

    env:
      SMOKE_MAX_ATTEMPTS: "45"
      SMOKE_SLEEP_SECONDS: "2"
      COMPOSE_BROWSER_TESTS: "1"
      E2E_ALLOW_MUTATIONS: "1"
      PLAYWRIGHT_BROWSER_CHANNEL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Set up Python for explicit seed, recovery and rollback
        uses: ./.github/actions/setup-python-ci
        with:
          python-version: "3.11.15"
          install-command: ""

      - name: Set up browser test dependencies
        uses: ./.github/actions/setup-node-ci

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Fresh-build, start and smoke-test full stack
        run: make compose-ci

      - name: Verify isolated database recovery
        run: make db-recovery-drill

      - name: Verify versioned update and application rollback
        run: make release-drill

      - name: Write Docker Compose CI summary
        if: always()
        run: |
          {
            echo "## Docker Compose CI evidence"
            echo ""
            echo "| Evidence | Path |"
            echo "|---|---|"
            echo "| Compose process snapshot | \`ci-cd/reports/docker-compose-ps.txt\` |"
            echo "| Compose failure logs | \`ci-cd/reports/docker-compose-logs.txt\` |"
            echo "| Docker profile configs | \`ci-cd/reports/docker/\` |"
            echo "| Observability smoke evidence | \`ci-cd/reports/observability/\` |"
            echo "| Browser journeys and failure traces | \`ci-cd/reports/e2e/\` |"
            echo "| Database recovery report | \`ci-cd/reports/db/recovery/*/report.json\` |"
            echo "| Release manifests and rollback report | \`ci-cd/reports/releases/\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Compose smoke evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: docker-compose-ci-evidence
          path: |
            ci-cd/reports/docker-compose-ps.txt
            ci-cd/reports/docker-compose-logs.txt
            ci-cd/reports/docker/
            ci-cd/reports/observability/
            ci-cd/reports/e2e/
            ci-cd/reports/db/recovery/*/report.json
            ci-cd/reports/db/recovery/*/commands.log
            ci-cd/reports/releases/*/report.json
            ci-cd/reports/releases/*/*-manifest.json
            ci-cd/reports/releases/*/*-build.json
            ci-cd/reports/releases/*/commands.log
            ci-cd/reports/releases/*/*/failure.png
            ci-cd/reports/releases/*/*/trace.zip
          if-no-files-found: ignore
