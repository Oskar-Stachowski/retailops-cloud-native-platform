name: Frontend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_REPORT_DIR: ci-cd/reports/frontend

jobs:
  intelligence-ui:
    name: Personal forecast and suggestion UI with actual PostgreSQL and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: retailops
          POSTGRES_PASSWORD: retailops
          POSTGRES_DB: retailops_ui_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U retailops -d retailops_ui_acceptance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://retailops:retailops@127.0.0.1:5432/retailops_ui_acceptance
      RETAILOPS_UI_DISPOSABLE_DB: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/api
      PLAYWRIGHT_BROWSER_CHANNEL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python CI toolchain
        uses: ./.github/actions/setup-python-ci
      - name: Set up locked frontend toolchain
        uses: ./.github/actions/setup-node-ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check UI drill before runtime
        run: |
          python -m ruff check scripts/intelligence-ui --config pyproject.toml
          python -m ruff format --check scripts/intelligence-ui --config pyproject.toml
          python -m mypy --config-file pyproject.toml scripts/intelligence-ui
      - name: Require actual scoped UI, lineage, paging and revocation
        run: python scripts/intelligence-ui/drill.py
      - name: Upload bounded UI evidence without credentials
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: intelligence-ui-evidence
          path: ci-cd/reports/intelligence-ui/
          if-no-files-found: error

  frontend-quality-checks:
    name: Frontend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js CI toolchain
        uses: ./.github/actions/setup-node-ci

      - name: Prepare frontend evidence directory
        working-directory: .
        run: mkdir -p "${FRONTEND_REPORT_DIR}"

      - name: Run frontend tests
        run: |
          set -euo pipefail
          npm test 2>&1 | tee ../ci-cd/reports/frontend/test.txt

      - name: Run frontend lint
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee ../ci-cd/reports/frontend/lint.txt

      - name: Upload frontend quality evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: frontend-quality-evidence
          path: |
            ci-cd/reports/frontend/test.txt
            ci-cd/reports/frontend/lint.txt
          if-no-files-found: warn

  frontend-build:
    name: Build frontend application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-quality-checks

    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js CI toolchain
        uses: ./.github/actions/setup-node-ci

      - name: Prepare frontend evidence directory
        working-directory: .
        run: mkdir -p "${FRONTEND_REPORT_DIR}"

      - name: Build frontend application
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../ci-cd/reports/frontend/build.txt

      - name: Upload frontend build evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: frontend-build-evidence
          path: |
            ci-cd/reports/frontend/build.txt
            frontend/dist/
          if-no-files-found: warn

  frontend-docker-image:
    name: Build frontend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-build

    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare Docker evidence directory
        working-directory: .
        run: mkdir -p ci-cd/reports/docker

      - name: Build frontend Docker image
        run: docker build -t retailops-frontend:ci .

      - name: Capture frontend image metadata
        if: always()
        working-directory: .
        run: docker image inspect retailops-frontend:ci > ci-cd/reports/docker/frontend-image-inspect.json

      - name: Upload frontend image build evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: frontend-image-build-evidence
          path: ci-cd/reports/docker/frontend-image-inspect.json
          if-no-files-found: warn
