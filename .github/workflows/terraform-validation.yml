name: Terraform Validation CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.15.1"

jobs:
  terraform-validate:
    name: Terraform fmt, init and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Show Terraform version
        run: terraform version

      - name: Run local IaC scan
        run: make terraform-fmt-check terraform-validate

      - name: Verify state controls and drift classification without AWS
        run: make terraform-state-test

      - name: Upload Terraform validation evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: terraform-validation-evidence
          path: |
            ci-cd/reports/iac/terraform-validate.txt
            ci-cd/reports/terraform-state/contract-drill.json
          if-no-files-found: warn
