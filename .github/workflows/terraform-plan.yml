name: Terraform State and Drift Review

on:
  workflow_dispatch:
    inputs:
      run_dev_plan:
        description: "Run a read-only infrastructure plan on main using the configured AWS role."
        required: true
        type: boolean
        default: false
      mode:
        description: "Baseline has no state; drift requires the configured existing S3 state."
        required: true
        type: choice
        options:
          - baseline
          - drift
        default: baseline

permissions:
  contents: read

concurrency:
  group: terraform-state-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.15.1"

jobs:
  terraform-validation:
    name: Validate Terraform before planning
    uses: ./.github/workflows/terraform-validation.yml

  terraform-plan-dev:
    name: Guarded dev state and drift review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: terraform-validation
    if: github.event_name == 'workflow_dispatch' && inputs.run_dev_plan == true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require the protected main branch and pinned account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_TERRAFORM_ACCOUNT_ID }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${EXPECTED_ACCOUNT}" =~ ^[0-9]{12}$ ]]

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: retailops-terraform-plan
          allowed-account-ids: ${{ vars.AWS_TERRAFORM_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify AWS credentials are available without printing account details
        run: aws sts get-caller-identity >/dev/null

      - name: Review baseline or existing remote state
        env:
          PLAN_MODE: ${{ inputs.mode }}
          TF_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_TERRAFORM_ACCOUNT_ID }}
          TF_BACKEND_CONFIG_JSON: ${{ vars.TF_BACKEND_CONFIG_JSON }}
        run: |
          umask 077
          args=(--mode "${PLAN_MODE}")
          if [[ "${PLAN_MODE}" = "drift" ]]; then
            config_path="${RUNNER_TEMP}/retailops-backend.config.json"
            export RETAILOPS_BACKEND_CONFIG_PATH="${config_path}"
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(os.environ["TF_BACKEND_CONFIG_JSON"])
          Path(os.environ["RETAILOPS_BACKEND_CONFIG_PATH"]).write_text(json.dumps(config))
          PY
            args+=(--backend-config "${config_path}")
            trap 'rm -f "${config_path}"' EXIT
          fi
          python3 scripts/terraform/plan.py "${args[@]}"

      - name: Upload Terraform plan evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: terraform-dev-plan-evidence
          path: ci-cd/reports/terraform-state/**/report.json
          if-no-files-found: warn
