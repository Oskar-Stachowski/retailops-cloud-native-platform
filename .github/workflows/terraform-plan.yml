name: Terraform Dev Plan

on:
  workflow_dispatch:
    inputs:
      run_dev_plan:
        description: "Run terraform plan for dev. Requires safe AWS credentials configured for this workflow. This workflow never runs terraform apply."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-dev-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  terraform-validation:
    name: Validate Terraform before planning
    uses: ./.github/workflows/terraform-validation.yml

  terraform-plan-dev:
    name: Optional dev Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: terraform-validation
    if: github.event_name == 'workflow_dispatch' && inputs.run_dev_plan == true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: retailops-terraform-plan

      - name: Verify AWS credentials are available without printing account details
        run: aws sts get-caller-identity >/dev/null

      - name: Create dev Terraform plan report
        run: make terraform-plan-dev

      - name: Upload Terraform plan evidence
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: terraform-dev-plan-evidence
          path: ci-cd/reports/iac/terraform-plan-dev.txt
          if-no-files-found: warn
