name: Required CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: required-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      base_sha: ${{ steps.refs.outputs.base_sha }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
      api: ${{ steps.detect.outputs.api }}
      frontend: ${{ steps.detect.outputs.frontend }}
      data: ${{ steps.detect.outputs.data }}
      docker: ${{ steps.detect.outputs.docker }}
      terraform: ${{ steps.detect.outputs.terraform }}
      kubernetes: ${{ steps.detect.outputs.kubernetes }}
      security: ${{ steps.detect.outputs.security }}
      policy: ${{ steps.detect.outputs.policy }}
      shared: ${{ steps.detect.outputs.shared }}
      unknown: ${{ steps.detect.outputs.unknown }}
      docs_only: ${{ steps.detect.outputs.docs_only }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve comparison refs
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          head_sha="${EVENT_HEAD_SHA}"
          base_sha=""

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base_sha="${PUSH_BASE_SHA}"
          fi

          if [[ -z "${head_sha}" ]] || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            head_sha="$(git rev-parse HEAD)"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || printf '%s' "${empty_tree}")"
          fi

          {
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Detect required gates
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          detector_args=(
            --stdin0
            --github-output "${GITHUB_OUTPUT}"
            --summary "${GITHUB_STEP_SUMMARY}"
          )

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            detector_args+=(--all)
          fi

          git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" |
            python3 scripts/ci/detect_required_ci_changes.py "${detector_args[@]}"

  repo-hygiene-gate:
    name: Repository diff hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate diff hygiene
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect-changes.outputs.head_sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"

  contract-gate:
    name: Required CI contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test path detection matrix
        run: python3 scripts/ci/test_detect_required_ci_changes.py

      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7 -color

  api-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    uses: ./.github/workflows/api-ci.yml

  frontend-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  data-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.data == 'true'
    uses: ./.github/workflows/data-ci.yml
    with:
      data_profile: small

  docker-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker-ci.yml

  terraform-validation-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform-plan.yml

  iac-security-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    uses: ./.github/workflows/iac-security.yml

  kubernetes-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.kubernetes == 'true'
    uses: ./.github/workflows/kubernetes-ci.yml

  security-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.security == 'true'
    uses: ./.github/workflows/security-ci.yml
    secrets: inherit

  required-result:
    name: required-result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
      - repo-hygiene-gate
      - contract-gate
      - api-gate
      - frontend-gate
      - data-gate
      - docker-gate
      - terraform-validation-gate
      - iac-security-gate
      - kubernetes-gate
      - security-gate
    if: always()

    steps:
      - name: Verify every required gate ran and passed
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          HYGIENE_RESULT: ${{ needs.repo-hygiene-gate.result }}
          CONTRACT_RESULT: ${{ needs.contract-gate.result }}
          EXPECTED_API: ${{ needs.detect-changes.outputs.api }}
          API_RESULT: ${{ needs.api-gate.result }}
          EXPECTED_FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend-gate.result }}
          EXPECTED_DATA: ${{ needs.detect-changes.outputs.data }}
          DATA_RESULT: ${{ needs.data-gate.result }}
          EXPECTED_DOCKER: ${{ needs.detect-changes.outputs.docker }}
          DOCKER_RESULT: ${{ needs.docker-gate.result }}
          EXPECTED_TERRAFORM: ${{ needs.detect-changes.outputs.terraform }}
          TERRAFORM_RESULT: ${{ needs.terraform-validation-gate.result }}
          IAC_SECURITY_RESULT: ${{ needs.iac-security-gate.result }}
          EXPECTED_KUBERNETES: ${{ needs.detect-changes.outputs.kubernetes }}
          KUBERNETES_RESULT: ${{ needs.kubernetes-gate.result }}
          EXPECTED_SECURITY: ${{ needs.detect-changes.outputs.security }}
          SECURITY_RESULT: ${{ needs.security-gate.result }}
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          failed=false

          require_success() {
            local gate="$1"
            local result="$2"
            echo "${gate}: required=true result=${result}"
            if [[ "${result}" != "success" ]]; then
              failed=true
            fi
          }

          require_conditional_result() {
            local gate="$1"
            local expected="$2"
            local result="$3"

            echo "${gate}: required=${expected} result=${result}"

            if [[ "${expected}" == "true" ]]; then
              if [[ "${result}" != "success" ]]; then
                failed=true
              fi
            elif [[ "${expected}" == "false" ]]; then
              if [[ "${result}" != "skipped" ]]; then
                failed=true
              fi
            else
              echo "${gate}: invalid required flag '${expected}'"
              failed=true
            fi
          }

          require_success "detect-changes" "${DETECT_RESULT}"
          require_success "repo-hygiene-gate" "${HYGIENE_RESULT}"
          require_success "contract-gate" "${CONTRACT_RESULT}"
          require_conditional_result "api-gate" "${EXPECTED_API}" "${API_RESULT}"
          require_conditional_result "frontend-gate" "${EXPECTED_FRONTEND}" "${FRONTEND_RESULT}"
          require_conditional_result "data-gate" "${EXPECTED_DATA}" "${DATA_RESULT}"
          require_conditional_result "docker-gate" "${EXPECTED_DOCKER}" "${DOCKER_RESULT}"
          require_conditional_result "terraform-validation-gate" "${EXPECTED_TERRAFORM}" "${TERRAFORM_RESULT}"
          require_conditional_result "iac-security-gate" "${EXPECTED_TERRAFORM}" "${IAC_SECURITY_RESULT}"
          require_conditional_result "kubernetes-gate" "${EXPECTED_KUBERNETES}" "${KUBERNETES_RESULT}"
          require_conditional_result "security-gate" "${EXPECTED_SECURITY}" "${SECURITY_RESULT}"

          if [[ "${EXPECTED_API}${EXPECTED_FRONTEND}${EXPECTED_DATA}${EXPECTED_DOCKER}${EXPECTED_TERRAFORM}${EXPECTED_KUBERNETES}${EXPECTED_SECURITY}" == "falsefalsefalsefalsefalsefalsefalse" && "${DOCS_ONLY}" != "true" ]]; then
            echo "No domain gate was selected for a non-documentation change."
            failed=true
          fi

          if [[ "${failed}" == "true" ]]; then
            echo "Required CI failed: at least one required gate was missing, skipped, cancelled or unsuccessful."
            exit 1
          fi

          echo "Required CI passed: every selected full gate completed successfully."
