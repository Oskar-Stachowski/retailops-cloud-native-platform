name: IaC Security CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.15.1"
  CHECKOV_VERSION: "3.2.520"
  IAC_REPORT_DIR: "ci-cd/reports/iac"

jobs:
  tflint:
    name: TFLint IaC quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: Prepare IaC report directory
        run: mkdir -p "${IAC_REPORT_DIR}"

      - name: Show tool versions
        run: |
          terraform version
          tflint --version

      - name: Initialize TFLint plugins
        run: tflint --init --config "${GITHUB_WORKSPACE}/security/iac/tflint.hcl"

      - name: Run TFLint
        working-directory: infra
        run: |
          set -o pipefail
          tflint --recursive \
            --config "${GITHUB_WORKSPACE}/security/iac/tflint.hcl" \
            --format compact | tee "${GITHUB_WORKSPACE}/${IAC_REPORT_DIR}/tflint.txt"

      - name: Upload TFLint report
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: iac-tflint-report
          path: ci-cd/reports/iac/tflint.txt
          if-no-files-found: warn

  checkov:
    name: Checkov IaC security report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python and Checkov
        uses: ./.github/actions/setup-python-ci
        with:
          install-command: python -m pip install "checkov==${CHECKOV_VERSION}"

      - name: Prepare IaC report directory
        run: mkdir -p "${IAC_REPORT_DIR}"

      - name: Run critical IaC guardrail checks
        run: make iac-critical-guardrails

      - name: Run blocking Checkov scan
        run: make checkov-report

      - name: Run Checkov JSON report
        if: always()
        run: make checkov-json

      - name: Upload Checkov reports
        if: always()
        uses: ./.github/actions/upload-ci-evidence
        with:
          name: iac-checkov-reports
          path: |
            ci-cd/reports/iac/checkov.txt
            ci-cd/reports/iac/checkov.json
          if-no-files-found: warn
